<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول Google Sheets Ritz إلى XLS</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        :root{--p:#2563eb;--bg:#f8fafc;--c:#fff}
        body{font-family:system-ui,sans-serif;background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
        .box{background:var(--c);padding:2rem;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);max-width:700px;width:100%;direction:rtl;text-align:right}
        h1{margin-top:0;color:#1e293b;font-size:1.4rem}
        .note{background:#eff6ff;border-right:4px solid var(--p);padding:10px;font-size:.85rem;margin-bottom:1.5rem;color:#1e40af}
        label{display:block;font-weight:600;margin-bottom:.5rem;color:#334155}
        textarea{width:100%;height:180px;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-family:monospace;font-size:.8rem;resize:vertical;box-sizing:border-box;direction:ltr;text-align:left}
        input[type=text]{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:1rem;box-sizing:border-box}
        button{background:var(--p);color:#fff;border:none;padding:12px;border-radius:6px;font-size:1rem;cursor:pointer;width:100%}
        button:hover{background:#1d4ed8}
        #status{margin-top:1rem;text-align:center;font-size:.9rem;min-height:1.2em}
    </style>
</head>
<body>
<div class="box">
    <h1>📊 محول Google Sheets Ritz JSON → XLS</h1>
    <div class="note">
        <strong>ℹ️ مخصص لبيانات Ritz:</strong> الصق محتوى JSON الخام المستخرج من Google Sheets (الذي يحتوي على حقول <code>dih</code>, <code>data</code>, <code>csm</code>). سيتم فك ترميز النصوص العربية الثنائية تلقائياً.
    </div>

    <label for="fileName">اسم الملف الناتج</label>
    <input type="text" id="fileName" value="google_sheets_export.xls" dir="ltr">

    <label for="jsonInput">الصق بيانات Ritz JSON هنا</label>
    <textarea id="jsonInput" placeholder='{"dih":...,"data":"{\"cid\":...}","edi":...}'></textarea>

    <button id="convertBtn">فك الترميز وتحويل إلى XLS</button>
    <div id="status"></div>
</div>

<script>
/**
 * Decodes Google Sheets Ritz UTF-16LE binary escape sequences
 * e.g., "\u0000\u0002\u0000\u0007" → actual Arabic characters
 */
function decodeRitzUtf16(str) {
    const bytes = [];
    for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        // Only capture byte-range values (0x00-0xFF), skip high unicode
        if (code <= 0xFF) {
            bytes.push(code);
        }
    }
    
    if (bytes.length === 0 || bytes.length % 2 !== 0) return str;
    
    try {
        const buffer = new Uint8Array(bytes).buffer;
        return new TextDecoder('utf-16le').decode(buffer);
    } catch {
        return str;
    }
}

/**
 * Strips control characters that corrupt Excel output
 */
function cleanCell(text) {
    if (!text) return '';
    // Remove null, bell, escape, record separator, unit separator, etc.
    let cleaned = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
    // Decode any remaining Ritz UTF-16LE sequences
    cleaned = decodeRitzUtf16(cleaned);
    // Trim and collapse whitespace
    return cleaned.trim().replace(/\s+/g, ' ');
}

/**
 * Parses the embedded HTML table from Ritz data field
 */
function parseRitzHtml(htmlStr) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlStr, 'text/html');
    const rows = doc.querySelectorAll('tr');
    const result = [];
    
    rows.forEach(tr => {
        const cells = tr.querySelectorAll('td');
        const rowData = [];
        cells.forEach(td => {
            rowData.push(cleanCell(td.textContent));
        });
        // Skip completely empty rows
        if (rowData.some(c => c !== '')) {
            result.push(rowData);
        }
    });
    
    return result;
}

document.getElementById('convertBtn').addEventListener('click', () => {
    const status = document.getElementById('status');
    const raw = document.getElementById('jsonInput').value.trim();
    
    if (!raw) {
        status.textContent = '❌ يرجى لصق بيانات JSON أولاً';
        status.style.color = '#dc2626';
        return;
    }
    
    try {
        if (typeof XLSX === 'undefined') throw new Error('فشل تحميل مكتبة SheetJS');
        
        // Step 1: Parse outer JSON
        let outerJson;
        try {
            outerJson = JSON.parse(raw);
        } catch {
            throw new Error('JSON الخارجي غير صالح. تأكد من نسخ كامل كائن Ritz.');
        }
        
        // Step 2: Parse inner data field (it's a stringified JSON)
        if (!outerJson.data) throw new Error('الحقل "data" مفقود من JSON');
        
        let innerData;
        try {
            innerData = JSON.parse(outerJson.data);
        } catch {
            throw new Error('الحقل "data" ليس JSON صالحاً');
        }
        
        // Step 3: Extract and parse the embedded HTML table
        if (!innerData.grh) throw new Error('الحقل "grh" (HTML) مفقود');
        
        const parsedRows = parseRitzHtml(innerData.grh);
        
        if (parsedRows.length === 0) {
            throw new Error('لم يتم العثور على بيانات صالحة في الجدول المضمن');
        }
        
        // Step 4: Build XLS
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(parsedRows);
        
        // Set RTL direction on the worksheet
        ws['!rtl'] = true;
        
        XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
        
        const filename = document.getElementById('fileName').value.endsWith('.xls')
            ? document.getElementById('fileName').value
            : document.getElementById('fileName').value + '.xls';
            
        XLSX.writeFile(wb, filename);
        
        status.textContent = `✅ نجح! تم استخراج ${parsedRows.length} صف وتنزيل ${filename}`;
        status.style.color = '#16a34a';
        
    } catch (err) {
        status.textContent = `❌ خطأ: ${err.message}`;
        status.style.color = '#dc2626';
        console.error(err);
    }
});
</script>
</body>
</html>
