<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database to XLS Converter</title>
    <!-- Pinned specific working version of SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { margin-top: 0; color: #1e293b; font-size: 1.5rem; }
        .note { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 10px; font-size: 0.85rem; margin-bottom: 1.5rem; color: #92400e; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #334155; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; font-size: 0.9rem; resize: vertical; box-sizing: border-box; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 1rem; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 1rem; text-align: center; font-size: 0.9rem; min-height: 1.2em;}
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Database to XLS Converter</h1>
        
        <div class="note">
            <strong>⚠️ Note:</strong> Browsers cannot read <code>.accdb</code> directly. 
            Export your Access table to <strong>CSV</strong>, then paste or drop it below.
        </div>

        <label for="fileName">Output Filename</label>
        <input type="text" id="fileName" value="converted_data.xls">

        <label for="csvInput">CSV Data (Paste or Drop File)</label>
        <textarea id="csvInput" placeholder="Name,Age,City&#10;Alice,30,NY&#10;Bob,25,LA"></textarea>
        <input type="file" id="fileInput" accept=".csv,.txt" style="display:none">

        <button id="convertBtn">Convert to XLS & Download</button>
        <div id="status"></div>
    </div>

    <script>
        // ✅ Native CSV Parser - No dependency on XLSX.utils.csv_to_sheet
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;
            
            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];
                
                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        currentCell += '"';
                        i++; // Skip escaped quote
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        currentCell += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        currentRow.push(currentCell);
                        currentCell = '';
                    } else if (char === '\r' && nextChar === '\n') {
                        currentRow.push(currentCell);
                        rows.push(currentRow);
                        currentRow = [];
                        currentCell = '';
                        i++; // Skip \n
                    } else if (char === '\n' || char === '\r') {
                        currentRow.push(currentCell);
                        rows.push(currentRow);
                        currentRow = [];
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
            }
            
            // Push last cell/row if file doesn't end with newline
            if (currentCell || currentRow.length > 0) {
                currentRow.push(currentCell);
                rows.push(currentRow);
            }
            
            return rows.filter(r => r.some(cell => cell.trim() !== ''));
        }

        const csvInput = document.getElementById('csvInput');
        const convertBtn = document.getElementById('convertBtn');
        const statusDiv = document.getElementById('status');
        const fileNameInput = document.getElementById('fileName');
        const fileInput = document.getElementById('fileInput');

        csvInput.addEventListener('click', () => {
            if (csvInput.value.trim() === '') fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                csvInput.value = evt.target.result;
                statusDiv.textContent = `✅ Loaded "${file.name}"`;
                statusDiv.style.color = '#16a34a';
            };
            reader.readAsText(file);
        });

        csvInput.addEventListener('dragover', (e) => { e.preventDefault(); csvInput.style.borderColor = '#2563eb'; });
        csvInput.addEventListener('dragleave', () => { csvInput.style.borderColor = '#cbd5e1'; });
        csvInput.addEventListener('drop', (e) => {
            e.preventDefault();
            csvInput.style.borderColor = '#cbd5e1';
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    csvInput.value = evt.target.result;
                    statusDiv.textContent = `✅ Dropped "${file.name}"`;
                    statusDiv.style.color = '#16a34a';
                };
                reader.readAsText(file);
            }
        });

        convertBtn.addEventListener('click', () => {
            const raw = csvInput.value.trim();
            if (!raw) {
                statusDiv.textContent = '❌ Please paste CSV data or upload a file.';
                statusDiv.style.color = '#dc2626';
                return;
            }

            try {
                // ✅ Verify XLSX loaded correctly
                if (typeof XLSX === 'undefined') {
                    throw new Error('SheetJS library failed to load. Check your internet connection.');
                }

                // ✅ Use native parser instead of csv_to_sheet
                const parsedData = parseCSV(raw);
                
                if (parsedData.length === 0) {
                    throw new Error('No valid data found in CSV.');
                }

                const workbook = XLSX.utils.book_new();
                const worksheet = XLSX.utils.aoa_to_sheet(parsedData); // aoa = Array of Arrays
                
                XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
                
                const filename = fileNameInput.value.endsWith('.xls') 
                    ? fileNameInput.value 
                    : fileNameInput.value + '.xls';
                    
                XLSX.writeFile(workbook, filename);
                
                statusDiv.textContent = `✅ Success! Downloading ${filename}...`;
                statusDiv.style.color = '#16a34a';
            } catch (err) {
                statusDiv.textContent = `❌ Error: ${err.message}`;
                statusDiv.style.color = '#dc2626';
                console.error(err);
            }
        });
    </script>
</body>
</html>
